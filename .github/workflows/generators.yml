name: Generators

on:
  pull_request:
    branches: [ main ]

jobs:
  test-generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            generators:
              - 'tools/generators/**'

      - name: Setup .NET
        if: steps.filter.outputs.generators == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test C# Generator
        if: steps.filter.outputs.generators == 'true'
        run: dotnet run --project tools/generators/csharp

      - name: Test PowerShell Generator
        if: steps.filter.outputs.generators == 'true'
        run: pwsh -File ./tools/generators/powershell/generate-snippets.ps1
